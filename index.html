<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile to Profit Assessment</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #f26314;
    --black: #141414;
    --bg: #f7f6f2;
    --card: #f5f4f2;
    --panel: #ffffff;
    --line: #e9e6e0;
    --text: #1c1c1c;
    --muted: #7d7d7d;
    --red: #d64545;
    --green: #3e9c5c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  html { overflow-x: hidden; }
  body {
    font-family: 'Inter', Arial, Helvetica, sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(rgba(20,20,20,0.08) 1.2px, transparent 1.2px),
      radial-gradient(ellipse 80% 60% at 50% 0%, #ffffff 0%, rgba(255,255,255,0) 70%);
    background-size: 22px 22px, auto;
    color: var(--text);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    font-size: 16px;
    line-height: 1.5;
    overflow-x: hidden;
  }
  .topbar {
    background: rgba(255,255,255,0.85);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(6px);
  }
  .topbar-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .logo { height: 30px; display: block; }
  .topbar-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .topbar-right { min-width: 92px; display: flex; justify-content: flex-end; }
  main {
    flex: 1;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }
  main.landing { max-width: 1100px; padding-top: 44px; }
  footer {
    color: var(--muted);
    font-size: 13px;
    padding: 44px 20px 28px;
    border-top: 1px solid var(--line);
    background: rgba(255,255,255,0.55);
  }
  .footer-top {
    max-width: 1100px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
  }
  .footer-logo { height: 40px; }
  .footer-meta {
    max-width: 1100px;
    margin: 22px auto 0;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    gap: 12px;
    font-size: 12px;
    color: var(--muted);
  }
  .footer-brand {
    font-weight: 800;
    font-size: clamp(64px, 13vw, 170px);
    line-height: 0.95;
    letter-spacing: -0.03em;
    text-transform: uppercase;
    color: var(--black);
    text-align: center;
    margin-top: 28px;
    margin-bottom: -0.12em;
    overflow: hidden;
  }
  .footer-brand-c { color: var(--orange); font-size: 0.32em; vertical-align: 0.9em; }
  @media (max-width: 680px) {
    .footer-top { flex-direction: column; gap: 16px; }
    .footer-meta { flex-direction: column; align-items: center; text-align: center; gap: 6px; }
  }
  .footer-nav { display: flex; flex-wrap: wrap; gap: 8px 26px; }
  .footer-nav a {
    color: var(--muted);
    text-decoration: none;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    cursor: pointer;
  }
  .footer-nav a:hover { color: var(--orange); }
  .footer-nav:empty { display: none; }
  h1 { font-size: 28px; line-height: 1.25; color: var(--black); font-weight: 800; }
  h2 { font-size: 22px; line-height: 1.3; color: var(--black); font-weight: 700; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 26px 22px;
    box-shadow: 0 14px 34px rgba(20,20,20,0.06);
  }
  .btn {
    display: block;
    width: 100%;
    min-height: 48px;
    background: var(--orange);
    color: #ffffff;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    font-family: inherit;
    border: none;
    border-radius: 10px;
    padding: 15px 18px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    transition: background 0.15s ease;
  }
  .btn:hover { background: #d95410; }
  .micro { color: var(--muted); font-size: 13px; text-align: center; margin-top: 12px; }
  .lang-btn {
    background: none;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 5px 11px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
  }
  .lang-btn + .lang-btn { margin-left: 6px; }
  .lang-btn.active { border-color: var(--orange); color: var(--orange); }

  /* ---------- Landing ---------- */
  .hero { text-align: center; max-width: 780px; margin: 0 auto; }
  .hero h1 {
    font-size: clamp(34px, 5.5vw, 56px);
    line-height: 1.12;
    letter-spacing: -0.02em;
  }
  .hero .accent {
    font-family: 'Instrument Serif', Georgia, serif;
    font-style: italic;
    font-weight: 400;
    color: var(--orange);
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-underline-offset: 7px;
  }
  .hero .sub {
    color: #55534f;
    font-size: 17px;
    max-width: 620px;
    margin: 20px auto 0;
  }
  .mockup {
    position: relative;
    height: 380px;
    max-width: 760px;
    margin: 46px auto 10px;
  }
  .mock-card { position: absolute; border-radius: 16px; }
  .mock-center {
    left: 50%;
    top: 0;
    transform: translateX(-50%);
    width: 256px;
    z-index: 3;
    background: var(--black);
    padding: 22px 20px 26px;
    box-shadow: 0 30px 60px rgba(20,20,20,0.28);
  }
  .mock-eyebrow {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 2.5px;
    color: var(--orange);
    text-transform: uppercase;
    text-align: center;
  }
  .mock-title {
    color: #ffffff;
    font-weight: 800;
    font-size: 17px;
    letter-spacing: 0.5px;
    text-align: center;
    margin-top: 6px;
    text-transform: uppercase;
  }
  .mock-serif {
    font-family: 'Instrument Serif', Georgia, serif;
    font-style: italic;
    color: #b5b3af;
    font-size: 12px;
    text-align: center;
    margin-top: 3px;
  }
  .mock-stages { margin-top: 18px; position: relative; }
  .mock-stage { display: flex; align-items: center; gap: 11px; padding: 7px 0; }
  .mock-dot {
    width: 11px; height: 11px;
    border-radius: 50%;
    border: 2px solid #4a4846;
    flex-shrink: 0;
  }
  .mock-stage.active .mock-dot { background: var(--orange); border-color: var(--orange); }
  .mock-stage span { font-size: 11.5px; color: #8b8987; font-weight: 600; }
  .mock-stage.active span { color: #ffffff; }
  .mock-side {
    top: 42px;
    width: 224px;
    z-index: 1;
    background: #201f1d;
    padding: 18px 17px 20px;
    box-shadow: 0 20px 44px rgba(20,20,20,0.22);
  }
  .mock-left { left: calc(50% - 318px); transform: rotate(-8deg); }
  .mock-right { right: calc(50% - 318px); transform: rotate(8deg); }
  .mock-side-title {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #b5b3af;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 14px;
  }
  .mock-pillar { margin-top: 10px; }
  .mock-pillar-name { font-size: 9.5px; color: #8b8987; font-weight: 600; margin-bottom: 4px; }
  .mock-track { background: #383634; height: 6px; border-radius: 3px; overflow: hidden; }
  .mock-fill { height: 100%; border-radius: 3px; }
  .mock-step { display: flex; align-items: center; gap: 10px; margin-top: 13px; }
  .mock-step-num {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: rgba(242,99,20,0.18);
    color: var(--orange);
    font-size: 10px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .mock-skel { height: 7px; border-radius: 4px; background: #383634; flex: 1; }
  .mock-skel.short { flex: 0.55; }
  .start-card {
    max-width: 560px;
    margin: 26px auto 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 30px 28px;
    box-shadow: 0 24px 50px rgba(20,20,20,0.10);
    position: relative;
  }
  .start-card .progress-label { text-align: left; }
  .start-card .progress-track { margin-bottom: 22px; }
  .start-peek {
    position: absolute;
    left: -34px;
    bottom: 18px;
    width: 74px;
    height: 92px;
    background: var(--black);
    border-radius: 10px;
    transform: rotate(-10deg);
    z-index: -1;
    box-shadow: 0 14px 30px rgba(20,20,20,0.2);
  }
  .start-peek::after {
    content: "";
    position: absolute;
    left: 12px; right: 12px; top: 16px;
    height: 5px;
    border-radius: 3px;
    background: var(--orange);
    box-shadow: 0 14px 0 #383634, 0 28px 0 #383634, 0 42px 0 #383634;
  }
  .ticker { background: var(--black); overflow: hidden; padding: 15px 0; }
  .ticker-track {
    display: inline-flex;
    align-items: center;
    white-space: nowrap;
    animation: tickermove 36s linear infinite;
  }
  @keyframes tickermove { to { transform: translateX(-50%); } }
  .tick-item {
    color: #d8d6d2;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    padding: 0 26px;
  }
  .tick-dot { color: var(--orange); font-size: 13px; }
  @media (max-width: 680px) {
    .topbar-title { display: none; }
    .testi-video-grid { grid-template-columns: repeat(2, 1fr); }
    .mockup {
      transform: scale(0.58);
      transform-origin: top center;
      height: 226px;
      margin-top: 34px;
    }
    .start-peek { display: none; }
    .hero .sub { font-size: 16px; }
  }

  /* ---------- Lead capture ---------- */
  .field { margin-top: 18px; }
  .field label { display: block; font-weight: 600; font-size: 15px; margin-bottom: 7px; color: var(--black); }
  .field input {
    width: 100%;
    min-height: 48px;
    padding: 11px 14px;
    font-size: 16px;
    font-family: inherit;
    border: 1px solid #dddbd7;
    border-radius: 8px;
    background: #ffffff;
    color: var(--text);
  }
  .field input:focus { outline: none; border-color: var(--orange); }
  .field input.invalid { border-color: var(--red); }
  .handle-wrap { position: relative; }
  .handle-wrap .at {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-weight: 600;
  }
  .handle-wrap input { padding-left: 32px; }

  /* ---------- Questions ---------- */
  .q-top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .back-btn {
    background: none;
    border: none;
    font-size: 22px;
    line-height: 1;
    color: var(--muted);
    cursor: pointer;
    padding: 11px 12px 11px 0;
    min-height: 44px;
    font-family: inherit;
  }
  .back-btn:hover { color: var(--black); }
  .progress-wrap { flex: 1; }
  .progress-label { font-size: 13px; font-weight: 700; color: var(--orange); margin-bottom: 5px; }
  .progress-track { background: var(--card); height: 8px; border-radius: 4px; overflow: hidden; }
  .progress-fill { background: var(--orange); height: 100%; border-radius: 4px; transition: width 0.3s ease; }
  .options { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; }
  .option {
    width: 100%;
    min-height: 48px;
    text-align: left;
    background: var(--card);
    border: 2px solid var(--card);
    border-radius: 10px;
    padding: 13px 15px;
    font-size: 16px;
    font-family: inherit;
    color: var(--text);
    cursor: pointer;
  }
  .option:hover { border-color: #dddbd7; }
  .option.selected { border-color: var(--orange); background: #fdeee2; }
  .open-area {
    width: 100%;
    min-height: 130px;
    margin-top: 22px;
    padding: 13px 15px;
    font-size: 16px;
    font-family: inherit;
    color: var(--text);
    background: var(--card);
    border: 2px solid var(--card);
    border-radius: 10px;
    resize: vertical;
  }
  .open-area:focus { outline: none; border-color: var(--orange); background: #ffffff; }
  .interstitial { text-align: center; padding-top: 90px; }
  .spinner {
    width: 42px;
    height: 42px;
    border: 4px solid #eceae5;
    border-top-color: var(--orange);
    border-radius: 50%;
    margin: 0 auto 24px;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Results ---------- */
  .greet-sub { color: var(--muted); margin-top: 6px; font-size: 15px; }
  .stage-card {
    background: var(--card);
    border-left: 5px solid var(--orange);
    border-radius: 8px;
    padding: 20px 18px;
    margin-top: 24px;
  }
  .stage-card h2 { font-size: 24px; }
  .stage-card p { margin-top: 10px; }
  .pillars { margin-top: 30px; display: flex; flex-direction: column; gap: 24px; }
  .pillar-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .pillar-name { font-weight: 700; color: var(--black); font-size: 16px; }
  .pillar-pct { font-weight: 800; font-size: 16px; }
  .bar-track { background: var(--card); height: 12px; border-radius: 6px; overflow: hidden; margin-top: 8px; }
  .bar-fill { height: 100%; border-radius: 6px; width: 0; transition: width 0.9s ease; }
  .verdict { color: var(--text); font-size: 14.5px; margin-top: 8px; }
  .fix-section { margin-top: 34px; }
  .fix-intro { margin-top: 10px; }
  .fix-steps { margin-top: 18px; display: flex; flex-direction: column; gap: 14px; }
  .fix-step {
    background: var(--card);
    border-radius: 12px;
    padding: 18px 17px;
  }
  .fix-step-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .fix-step-num {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--orange);
    color: #ffffff;
    font-weight: 800;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .fix-step-title { font-weight: 800; color: var(--black); font-size: 16px; flex: 1; min-width: 180px; }
  .fix-step-meta {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--orange);
    white-space: nowrap;
  }
  .fix-step-body { margin-top: 10px; font-size: 14.5px; }
  .fix-example {
    margin-top: 10px;
    border-left: 3px solid var(--orange);
    padding: 9px 13px;
    font-style: italic;
    font-size: 14px;
    color: #55534f;
    background: #ffffff;
    border-radius: 0 8px 8px 0;
  }
  .fix-outro { margin-top: 14px; font-weight: 600; }
  .benchmark {
    margin-top: 30px;
    background: var(--card);
    border-radius: 8px;
    padding: 16px 18px;
    font-size: 15px;
  }
  .outro-block {
    margin-top: 34px;
    background: var(--black);
    border-radius: 16px;
    padding: 30px 26px;
    text-align: center;
    color: #ffffff;
    font-size: 20px;
    font-weight: 700;
    line-height: 1.4;
  }
  .outro-block .accent {
    font-family: 'Instrument Serif', Georgia, serif;
    font-style: italic;
    font-weight: 400;
    color: var(--orange);
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-underline-offset: 6px;
  }
  .vsl { max-width: 680px; margin: 34px auto 0; }
  .video-frame {
    aspect-ratio: 16 / 9;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 24px 50px rgba(20,20,20,0.16);
    background: var(--black);
  }
  .video-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
  .wistia-frame { aspect-ratio: auto; }
  .wistia-frame wistia-player { display: block; width: 100%; }
  .eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--orange);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 14px;
  }
  .eyebrow::before, .eyebrow::after {
    content: "";
    height: 1px;
    width: 26px;
    background: var(--orange);
    opacity: 0.5;
  }
  .landing-section { max-width: 760px; margin: 72px auto 0; text-align: center; }
  .landing-section h2 { font-size: 26px; }
  .testi-video-grid {
    margin-top: 26px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 16px;
  }
  .testi-video-frame {
    aspect-ratio: 9 / 16;
    border-radius: 14px;
    overflow: hidden;
    background: var(--black);
    box-shadow: 0 18px 40px rgba(20,20,20,0.14);
  }
  .testi-video-frame iframe, .testi-video-frame video {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
    object-fit: cover;
  }
  .testi-video-caption { text-align: left; margin-top: 10px; }
  .testi-video-caption .testi-name { font-size: 14px; }
  .testi-video-caption .testi-line { font-size: 13.5px; margin-top: 2px; }
  .testi-grid {
    margin-top: 22px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 14px;
  }
  .testi-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 4px solid var(--orange);
    border-radius: 12px;
    padding: 18px 16px;
    text-align: left;
  }
  .testi-name { font-weight: 800; color: var(--black); font-size: 15px; }
  .testi-line { margin-top: 4px; font-size: 15px; color: #55534f; }
  .faq-list {
    margin-top: 22px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 680px;
    margin-left: auto;
    margin-right: auto;
  }
  .faq-acc {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    text-align: left;
  }
  .faq-acc summary {
    cursor: pointer;
    padding: 16px 18px;
    font-weight: 700;
    font-size: 15.5px;
    color: var(--black);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 14px;
    list-style: none;
  }
  .faq-acc summary::-webkit-details-marker { display: none; }
  .faq-ind {
    color: var(--orange);
    font-size: 22px;
    font-weight: 400;
    line-height: 1;
    flex-shrink: 0;
    transition: transform 0.2s ease;
  }
  .faq-acc[open] .faq-ind { transform: rotate(45deg); }
  .faq-a {
    padding: 0 18px 17px;
    font-size: 14.5px;
    color: #3f3d3a;
  }
  .landing-bottom-cta { max-width: 560px; margin: 52px auto 0; }
  .proof-lines { margin-top: 26px; text-align: center; }
  .proof-line { font-size: 14.5px; color: #55534f; margin-top: 6px; }
  .proof-name { font-weight: 800; color: var(--black); }
  .cta-block { margin-top: 30px; text-align: center; }
  .cta-block p { margin-top: 12px; text-align: left; }
  .cta-block .btn { margin-top: 20px; }
  .btn-ig { display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: 100%; }
  .ig-ic { flex-shrink: 0; }
  .video-placeholder { display: flex; align-items: center; justify-content: center; }
  .cta-mini { margin-top: 30px; }
  .results-testi { margin-top: 38px; text-align: center; }
  .results-testi h2 { font-size: 24px; }
  .results-faq { margin-top: 42px; text-align: center; }
  .results-faq h2 { font-size: 24px; }
  .results-faq .faq-list { margin-top: 22px; }
  .testi-video-grid.compact { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
  .testi-video-grid.compact .testi-name { font-size: 13px; }
  .testi-video-grid.compact .testi-line { font-size: 12.5px; }
  .c-red { color: var(--red); }
  .c-orange { color: var(--orange); }
  .c-green { color: var(--green); }
  .b-red { background: var(--red); }
  .b-orange { background: var(--orange); }
  .b-green { background: var(--green); }
  @media print {
    * {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    html, body { overflow-x: visible; }
    body { background: #ffffff; background-image: none; }
    .no-print, #ticker-slot, .topbar-right { display: none !important; }
    .topbar { background: #ffffff; backdrop-filter: none; }
    main { max-width: 100%; padding: 16px 0 0; }

    a: { nl: "Zo accuraat als jouw antwoorden eerlijk zijn. De scoring erachter is dezelfde vier-pijler analyse die ik gebruik als ik een profiel van mijn klanten zelf bekijk: positionering, content, conversie en aanbod. Dertien vragen zijn genoeg om te vinden welke pijler lekt, en dat is precies waar deze assessment voor bestaat: je op het juiste probleem richten. Wat hij niet kan weten zijn de details van jouw niche en jouw situatie. Dat kunnen we bespreken op WhatsApp en wellicht op een call.",
         en: "As accurate as your answers are honest. The scoring behind it is the same four-pillar analysis I use when I look at a client's profile myself: positioning, content, conversion and offer. Thirteen questions are enough to find which pillar is leaking, and that is exactly what this assessment is for: pointing you at the right problem. What it cannot know are the details of your niche and your situation. We can discuss that on WhatsApp and maybe on a call." } },
  { q: { nl: "Wat gebeurt er nadat ik je een DM stuur?", en: "What happens after I send you a DM?" },

         en: "Just a conversation, nothing more. Don't worry, I won't use my sales magic on you, I only save that for very special moments ;) Haha no, all jokes aside, I will simply ask you a couple of questions about your breakdown, mainly: which part felt most like your situation? If I think I can help you, I will offer to walk through your breakdown together in a short call of 20 to 30 minutes. If I think I cannot help you, I will send you a few of the best assets I know to help you anyway." } },
  { q: { nl: "Wat als ik nu nauwelijks content post?", en: "What if I barely post content right now?" },
    a: { nl: "Dan sta je er misschien wel beter voor dan de mensen die wel elke dag posten. Meer posten is bijna nooit stap één. Als je positionering onduidelijk is of er geen route is van aandacht naar een gesprek, betekent meer content alleen maar meer moeite die weglekt. De assessment scoort je op alle vier de pijlers, hoe veel of hoe weinig je ook post. En als content echt je zwakste punt is, begint je plan met een ritme dat je ook echt volhoudt. Niet per se dagelijks posten dus.",
         en: "Then you might be in a better position than the people who do post every day. Posting more is almost never step one. If your positioning is unclear or there is no path from attention to a conversation, more content just means more effort leaking away. The assessment scores you on all four pillars, however much or little you post. And if content really is your weakest point, your plan starts with a rhythm you can actually hold. So not necessarily daily posting." } },
  { q: { nl: "Heb ik veel volgers nodig om dit te laten werken?", en: "Do I need a big following for this to work?" },
    a: { nl: "Nee. Sterker nog: een klein publiek van de juiste mensen verslaat vijftigduizend van de verkeerde, elke keer weer. Klanten komen niet uit je volgersaantal, maar uit een duidelijk profiel, content met een taak en een systeem dat interesse omzet in gesprekken. Duizend volgers waarvan er honderd je ideale klant zijn, is een business. De assessment vraagt je volgersaantal als context, niet als oordeel.",
         en: "No. In fact: a small audience of the right people beats fifty thousand of the wrong ones, every single time. Clients do not come from your follower count, they come from a clear profile, content with a job, and a system that turns interest into conversations. A thousand followers where a hundred are your ideal clients is a business. The assessment asks for your follower count as context, not as a verdict." } },
  { q: { nl: "Hoe is dit anders dan andere marketing partners?", en: "How is this different from other marketing partners?" },
    a: { nl: "De meeste marketing partners verkopen je content: meer volume, betere edits, mooiere posts. Prima, maar content is één pijler van de vier. Als je positionering onduidelijk is of niks de aandacht opvangt die je posts creëren, maakt betere editing het lek alleen maar mooier. Ik werk aan het hele systeem: voor wie je gepositioneerd bent, wat je content moet doen, hoe interesse een gesprek wordt in de DM, en hoe je aanbod verkocht wordt. En het tweede verschil zie je nu: ik laat je mijn diagnose gratis zien, voordat je me iets betaald hebt.",
         en: "Most marketing partners sell you content: more volume, better edits, prettier posts. Fine, but content is one pillar out of four. If your positioning is unclear or nothing catches the attention your posts create, better editing just makes the leak look nicer. I work on the whole system: who you are positioned for, what your content is supposed to do, how interest becomes a conversation in the DMs, and how your offer gets sold. And the second difference is right in front of you: I show you my diagnosis for free, before you have paid me anything." } },
  { q: { nl: "Hoeveel tijd kost dit per week?", en: "How much time does this take per week?" },

function pixelTrack(name, isCustom) {
  if (window.fbq) fbq(isCustom ? 'trackCustom' : 'track', name);

function t(key) { return COPY[state.lang][key]; }

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function colorFor(pct) {
  if (pct < 40) return 'red';
  if (pct < 70) return 'orange';
  return 'green';
}

// Eased progress: jumps ahead early, slows down toward the end (Wistia-style).
function progressPct(num) {
  return Math.round(100 * Math.sqrt(num / 13));
}

function computeResults() {
  const pillars = PILLARS.map(function (p) {
    let points = 0;
    p.qs.forEach(function (qid) {
      const q = QUESTIONS.find(function (x) { return x.id === qid; });
      points += q.options[state.answers[qid]].points;
    });
    const pct = Math.round(points / p.max * 100);
    return { key: p.key, name: p.name, points: points, pct: pct, color: colorFor(pct) };
  });

  const byKey = {};
  pillars.forEach(function (p) { byKey[p.key] = p; });

  let stage;
  const allGreen = pillars.every(function (p) { return p.color === 'green'; });

  const minPct = Math.min.apply(null, pillars.map(function (p) { return p.pct; }));
  let weakestKey = null;
  TIE_PRIORITY.forEach(function (key) {
    if (weakestKey === null && byKey[key].pct === minPct) weakestKey = key;
  });

  if (allGreen) {
    stage = 5;
  } else if (
    weakestKey === 'conversion' &&
    byKey.conversion.color === 'orange' &&
    (state.answers.q11 === 2 || state.answers.q11 === 3)
  ) {
    stage = 4;
  } else {
    stage = STAGE_MAP[weakestKey];
  }

  return { pillars: pillars, byKey: byKey, weakestKey: weakestKey, stage: stage, allGreen: allGreen };
}

function buildPayload(results) {
  const answers = { q1: state.answers.q1 || '' };
  ['q2', 'q3', 'q4', 'q5', 'q6', 'q7', 'q8', 'q9', 'q10', 'q11'].forEach(function (qid) {
    const q = QUESTIONS.find(function (x) { return x.id === qid; });
    answers[qid] = q.options[state.answers[qid]].points;
  });
  answers.q12 = state.answers.q12 || '';
  answers.q13 = state.answers.q13 || '';

  const q10 = QUESTIONS.find(function (x) { return x.id === 'q10'; });
  const q11 = QUESTIONS.find(function (x) { return x.id === 'q11'; });

  return {
    name: state.lead.name,
    handle: state.lead.handle,
    email: state.lead.email,
    followers: state.lead.followers,
    lang: state.lang,
    answers: answers,
    q10_label: q10.options[state.answers.q10].en,
    q11_label: q11.options[state.answers.q11].en,
    scores: {
      positioning: results.byKey.positioning.pct,
      content: results.byKey.content.pct,
      conversion: results.byKey.conversion.pct,
      offer: results.byKey.offer.pct
    },
    colors: {
      positioning: results.byKey.positioning.color,
      content: results.byKey.content.color,
      conversion: results.byKey.conversion.color,
      offer: results.byKey.offer.color
    },
    weakest_pillar: results.byKey[results.weakestKey].name,
    stage: results.stage,
    stage_name: STAGES[results.stage].name[state.lang],
    completed_at: new Date().toISOString(),
    source_url: location.href
  };
}

function postResults(results) {
  if (state.posted) return;
  state.posted = true;
  pixelTrack('CompleteRegistration');
  pixelTrack('AssessmentComplete', true);
  if (!RESULTS_ENDPOINT) return;
  try {
    fetch(RESULTS_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(buildPayload(results)),
      keepalive: true
    }).catch(function (err) { console.log('Results POST failed:', err); });
  } catch (err) {
    console.log('Results POST failed:', err);
  }
}

  if (q.type === 'mc') {
    html += '<div class="options">';
    q.options.forEach(function (opt, i) {
      const sel = state.answers[q.id] === i ? ' selected' : '';
      html += '<button type="button" class="option' + sel + '" data-i="' + i + '">' + opt[state.lang] + '</button>';
    });
    html += '</div>';
  } else {
    html +=

      '<div class="field"><button type="button" class="btn" id="continue-btn">' + t('continueBtn') + '</button></div>';
  }
  html += '</div>';
  app.innerHTML = html;

  document.getElementById('back-btn').addEventListener('click', function () {
    if (state.advancing) return;
    if (state.qIndex === 0) {
      state.screen = 'lead';
    } else {
      state.qIndex -= 1;
    }
    render();
  });

  if (q.type === 'mc') {
    app.querySelectorAll('.option').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (state.advancing) return;
        state.advancing = true;
        state.answers[q.id] = parseInt(btn.getAttribute('data-i'), 10);
        app.querySelectorAll('.option').forEach(function (b) { b.classList.remove('selected'); });
        btn.classList.add('selected');
        setTimeout(function () {
          state.advancing = false;
          advance();
        }, 250);
      });
    });
  } else {
    document.getElementById('continue-btn').addEventListener('click', function () {
      state.answers[q.id] = document.getElementById('open-input').value.trim();
      advance();
    });
  }

      '<a class="btn btn-ig" href="' + DM_URL + '" target="_blank" rel="noopener">' + igIcon + '<span>' + t('ctaBtn') + '</span></a>' +
    '</div>';

  if (FAQ_ITEMS.length) {
    html += '<div class="results-faq no-print">' +
      '<div class="eyebrow">' + t('faqEyebrow') + '</div>' +
      '<h2>' + t('faqHeading') + '</h2>' +
      faqListHtml() +
      '</div>';
  }

  html += '</div>';

  app.innerHTML = html;

  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      app.querySelectorAll('.bar-fill').forEach(function (bar) {
        bar.style.width = bar.getAttribute('data-pct') + '%';
      });
    });
  });

  postResults(results);
}

document.getElementById('logo').src = LOGO_SRC;
document.getElementById('footer-logo').src = LOGO_SRC;
render();
</script>
</body>
</html>
