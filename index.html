<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile to Profit Assessment</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #f26314;
    --black: #141414;
    --bg: #f7f6f2;
    --card: #f5f4f2;
    --panel: #ffffff;
    --line: #e9e6e0;
    --text: #1c1c1c;
    --muted: #7d7d7d;
    --red: #d64545;
    --green: #3e9c5c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  html { overflow-x: hidden; }
  body {
    font-family: 'Inter', Arial, Helvetica, sans-serif;
    background: var(--bg);
    background-image: radial-gradient(ellipse 80% 60% at 50% 0%, #ffffff 0%, rgba(255,255,255,0) 70%);
    color: var(--text);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    font-size: 16px;
    line-height: 1.5;
    overflow-x: hidden;
  }
  .topbar {
    background: rgba(255,255,255,0.85);
    border-bottom: 1px solid var(--line);
    backdrop-filter: blur(6px);
  }
  .topbar-inner {
    max-width: 1100px;
    margin: 0 auto;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .logo { height: 30px; display: block; }
  .topbar-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: var(--muted);
  }
  .topbar-right { min-width: 92px; display: flex; justify-content: flex-end; }
  main {
    flex: 1;
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
    padding: 28px 20px 48px;
  }
  main.landing { max-width: 1100px; padding-top: 44px; }
  footer {
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    padding: 26px 16px 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .footer-logo { height: 20px; opacity: 0.85; }
  h1 { font-size: 28px; line-height: 1.25; color: var(--black); font-weight: 800; }
  h2 { font-size: 22px; line-height: 1.3; color: var(--black); font-weight: 700; }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 26px 22px;
    box-shadow: 0 14px 34px rgba(20,20,20,0.06);
  }
  .btn {
    display: block;
    width: 100%;
    min-height: 48px;
    background: var(--orange);
    color: #ffffff;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    font-family: inherit;
    border: none;
    border-radius: 10px;
    padding: 15px 18px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
    transition: background 0.15s ease;
  }
  .btn:hover { background: #d95410; }
  .micro { color: var(--muted); font-size: 13px; text-align: center; margin-top: 12px; }
  .lang-btn {
    background: none;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 5px 11px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    cursor: pointer;
  }
  .lang-btn + .lang-btn { margin-left: 6px; }
  .lang-btn.active { border-color: var(--orange); color: var(--orange); }

  /* ---------- Landing ---------- */
  .hero { text-align: center; max-width: 780px; margin: 0 auto; }
  .hero h1 {
    font-size: clamp(34px, 5.5vw, 56px);
    line-height: 1.12;
    letter-spacing: -0.02em;
  }
  .hero .accent {
    font-family: 'Instrument Serif', Georgia, serif;
    font-style: italic;
    font-weight: 400;
    color: var(--orange);
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-underline-offset: 7px;
  }
  .hero .sub {
    color: #55534f;
    font-size: 17px;
    max-width: 620px;
    margin: 20px auto 0;
  }
  .mockup {
    position: relative;
    height: 380px;
    max-width: 760px;
    margin: 46px auto 10px;
  }
  .mock-card { position: absolute; border-radius: 16px; }
  .mock-center {
    left: 50%;
    top: 0;
    transform: translateX(-50%);
    width: 256px;
    z-index: 3;
    background: var(--black);
    padding: 22px 20px 26px;
    box-shadow: 0 30px 60px rgba(20,20,20,0.28);
  }
  .mock-eyebrow {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 2.5px;
    color: var(--orange);
    text-transform: uppercase;
    text-align: center;
  }
  .mock-title {
    color: #ffffff;
    font-weight: 800;
    font-size: 17px;
    letter-spacing: 0.5px;
    text-align: center;
    margin-top: 6px;
    text-transform: uppercase;
  }
  .mock-serif {
    font-family: 'Instrument Serif', Georgia, serif;
    font-style: italic;
    color: #b5b3af;
    font-size: 12px;
    text-align: center;
    margin-top: 3px;
  }
  .mock-stages { margin-top: 18px; position: relative; }
  .mock-stage { display: flex; align-items: center; gap: 11px; padding: 7px 0; }
  .mock-dot {
    width: 11px; height: 11px;
    border-radius: 50%;
    border: 2px solid #4a4846;
    flex-shrink: 0;
  }
  .mock-stage.active .mock-dot { background: var(--orange); border-color: var(--orange); }
  .mock-stage span { font-size: 11.5px; color: #8b8987; font-weight: 600; }
  .mock-stage.active span { color: #ffffff; }
  .mock-side {
    top: 42px;
    width: 224px;
    z-index: 1;
    background: #201f1d;
    padding: 18px 17px 20px;
    box-shadow: 0 20px 44px rgba(20,20,20,0.22);
  }
  .mock-left { left: calc(50% - 318px); transform: rotate(-8deg); }
  .mock-right { right: calc(50% - 318px); transform: rotate(8deg); }
  .mock-side-title {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 2px;
    color: #b5b3af;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 14px;
  }
  .mock-pillar { margin-top: 10px; }
  .mock-pillar-name { font-size: 9.5px; color: #8b8987; font-weight: 600; margin-bottom: 4px; }
  .mock-track { background: #383634; height: 6px; border-radius: 3px; overflow: hidden; }
  .mock-fill { height: 100%; border-radius: 3px; }
  .mock-step { display: flex; align-items: center; gap: 10px; margin-top: 13px; }
  .mock-step-num {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: rgba(242,99,20,0.18);
    color: var(--orange);
    font-size: 10px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .mock-skel { height: 7px; border-radius: 4px; background: #383634; flex: 1; }
  .mock-skel.short { flex: 0.55; }
  .start-card {
    max-width: 560px;
    margin: 26px auto 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 30px 28px;
    box-shadow: 0 24px 50px rgba(20,20,20,0.10);
    position: relative;
  }
  .start-card .progress-label { text-align: left; }
  .start-card .progress-track { margin-bottom: 22px; }
  .start-peek {
    position: absolute;
    left: -34px;
    bottom: 18px;
    width: 74px;
    height: 92px;
    background: var(--black);
    border-radius: 10px;
    transform: rotate(-10deg);
    z-index: -1;
    box-shadow: 0 14px 30px rgba(20,20,20,0.2);
  }
  .start-peek::after {
    content: "";
    position: absolute;
    left: 12px; right: 12px; top: 16px;
    height: 5px;
    border-radius: 3px;
    background: var(--orange);
    box-shadow: 0 14px 0 #383634, 0 28px 0 #383634, 0 42px 0 #383634;
  }
  .ticker { background: var(--black); overflow: hidden; padding: 15px 0; }
  .ticker-track {
    display: inline-flex;
    align-items: center;
    white-space: nowrap;
    animation: tickermove 36s linear infinite;
  }
  @keyframes tickermove { to { transform: translateX(-50%); } }
  .tick-item {
    color: #d8d6d2;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    padding: 0 26px;
  }
  .tick-dot { color: var(--orange); font-size: 13px; }
  @media (max-width: 680px) {
    .topbar-title { display: none; }
    .mockup {
      transform: scale(0.58);
      transform-origin: top center;
      height: 226px;
      margin-top: 34px;
    }
    .start-peek { display: none; }
    .hero .sub { font-size: 16px; }
  }

  /* ---------- Lead capture ---------- */
  .field { margin-top: 18px; }
  .field label { display: block; font-weight: 600; font-size: 15px; margin-bottom: 7px; color: var(--black); }
  .field input {
    width: 100%;
    min-height: 48px;
    padding: 11px 14px;
    font-size: 16px;
    font-family: inherit;
    border: 1px solid #dddbd7;
    border-radius: 8px;
    background: #ffffff;
    color: var(--text);
  }
  .field input:focus { outline: none; border-color: var(--orange); }
  .field input.invalid { border-color: var(--red); }
  .handle-wrap { position: relative; }
  .handle-wrap .at {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    font-weight: 600;
  }
  .handle-wrap input { padding-left: 32px; }

  /* ---------- Questions ---------- */
  .q-top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .back-btn {
    background: none;
    border: none;
    font-size: 22px;
    line-height: 1;
    color: var(--muted);
    cursor: pointer;
    padding: 11px 12px 11px 0;
    min-height: 44px;
    font-family: inherit;
  }
  .back-btn:hover { color: var(--black); }
  .progress-wrap { flex: 1; }
  .progress-label { font-size: 13px; font-weight: 700; color: var(--orange); margin-bottom: 5px; }
  .progress-track { background: var(--card); height: 8px; border-radius: 4px; overflow: hidden; }
  .progress-fill { background: var(--orange); height: 100%; border-radius: 4px; transition: width 0.3s ease; }
  .options { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; }
  .option {
    width: 100%;
    min-height: 48px;
    text-align: left;
    background: var(--card);
    border: 2px solid var(--card);
    border-radius: 10px;
    padding: 13px 15px;
    font-size: 16px;
    font-family: inherit;
    color: var(--text);
    cursor: pointer;
  }
  .option:hover { border-color: #dddbd7; }
  .option.selected { border-color: var(--orange); background: #fdeee2; }
  .open-area {
    width: 100%;
    min-height: 130px;
    margin-top: 22px;
    padding: 13px 15px;
    font-size: 16px;
    font-family: inherit;
    color: var(--text);
    background: var(--card);
    border: 2px solid var(--card);
    border-radius: 10px;
    resize: vertical;
  }
  .open-area:focus { outline: none; border-color: var(--orange); background: #ffffff; }
  .interstitial { text-align: center; padding-top: 90px; }
  .spinner {
    width: 42px;
    height: 42px;
    border: 4px solid #eceae5;
    border-top-color: var(--orange);
    border-radius: 50%;
    margin: 0 auto 24px;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Results ---------- */
  .greet-sub { color: var(--muted); margin-top: 6px; font-size: 15px; }
  .stage-card {
    background: var(--card);
    border-left: 5px solid var(--orange);
    border-radius: 8px;
    padding: 20px 18px;
    margin-top: 24px;
  }
  .stage-card h2 { font-size: 24px; }
  .stage-card p { margin-top: 10px; }
  .pillars { margin-top: 30px; display: flex; flex-direction: column; gap: 24px; }
  .pillar-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .pillar-name { font-weight: 700; color: var(--black); font-size: 16px; }
  .pillar-pct { font-weight: 800; font-size: 16px; }
  .bar-track { background: var(--card); height: 12px; border-radius: 6px; overflow: hidden; margin-top: 8px; }
  .bar-fill { height: 100%; border-radius: 6px; width: 0; transition: width 0.9s ease; }
  .verdict { color: var(--text); font-size: 14.5px; margin-top: 8px; }
  .fix-section { margin-top: 34px; }
  .fix-intro { margin-top: 10px; }
  .fix-list { margin-top: 14px; padding-left: 22px; display: flex; flex-direction: column; gap: 10px; }
  .fix-outro { margin-top: 12px; }
  .benchmark {
    margin-top: 30px;
    background: var(--card);
    border-radius: 8px;
    padding: 16px 18px;
    font-size: 15px;
  }
  .outro-block {
    margin-top: 34px;
    background: var(--black);
    border-radius: 16px;
    padding: 30px 26px;
    text-align: center;
    color: #ffffff;
    font-size: 20px;
    font-weight: 700;
    line-height: 1.4;
  }
  .outro-block .accent {
    font-family: 'Instrument Serif', Georgia, serif;
    font-style: italic;
    font-weight: 400;
    color: var(--orange);
    text-decoration: underline;
    text-decoration-thickness: 2px;
    text-underline-offset: 6px;
  }
  .btn-outline {
    margin-top: 16px;
    background: none;
    color: var(--black);
    border: 2px solid var(--black);
    transition: background 0.15s ease, color 0.15s ease;
  }
  .btn-outline:hover { background: var(--black); color: #ffffff; }
  .c-red { color: var(--red); }
  .c-orange { color: var(--orange); }
  .c-green { color: var(--green); }
  .b-red { background: var(--red); }
  .b-orange { background: var(--orange); }
  .b-green { background: var(--green); }
  @media print {
    * {
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    html, body { overflow-x: visible; }
    body { background: #ffffff; background-image: none; }
    .no-print, #ticker-slot, .topbar-right { display: none !important; }
    .topbar { background: #ffffff; backdrop-filter: none; }
    main { max-width: 100%; padding: 16px 0 0; }
    .panel { border: none; box-shadow: none; padding: 0; }
    .stage-card, .pillar, .benchmark, .outro-block, .fix-list li { break-inside: avoid; }
    .fix-section { break-before: auto; }
    .bar-fill { transition: none; }
  }
</style>
</head>
<body>

  <div class="topbar-inner">
    <img class="logo" id="logo" alt="Aithos" src="">
    <div class="topbar-title">Profile to Profit Assessment&trade;</div>
    <div class="topbar-right" id="topbar-right"></div>
  </div>
</header>
<main id="app"></main>
<div id="ticker-slot"></div>
<footer>
  <img class="footer-logo" id="footer-logo" alt="Aithos" src="">
  <div id="footer-text"></div>
</footer>

const state = {
  lang: new URLSearchParams(location.search).get('lang') === 'nl' ? 'nl' : 'en',
  screen: 'landing',
  qIndex: 0,
  lead: { name: '', handle: '', email: '', followers: '' },
  answers: {},
  posted: false,
  advancing: false
};

function t(key) { return COPY[state.lang][key]; }

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function colorFor(pct) {
  if (pct < 40) return 'red';
  if (pct < 70) return 'orange';
  return 'green';
}

function computeResults() {
  const pillars = PILLARS.map(function (p) {
    let points = 0;
    p.qs.forEach(function (qid) {
      const q = QUESTIONS.find(function (x) { return x.id === qid; });
      points += q.options[state.answers[qid]].points;
    });
    const pct = Math.round(points / p.max * 100);
    return { key: p.key, name: p.name, points: points, pct: pct, color: colorFor(pct) };
  });

  const byKey = {};
  pillars.forEach(function (p) { byKey[p.key] = p; });

  let stage;
  const allGreen = pillars.every(function (p) { return p.color === 'green'; });

  const minPct = Math.min.apply(null, pillars.map(function (p) { return p.pct; }));
  let weakestKey = null;
  TIE_PRIORITY.forEach(function (key) {
    if (weakestKey === null && byKey[key].pct === minPct) weakestKey = key;
  });

  if (allGreen) {
    stage = 5;
  } else if (
    weakestKey === 'conversion' &&
    byKey.conversion.color === 'orange' &&
    (state.answers.q11 === 2 || state.answers.q11 === 3)
  ) {
    stage = 4;
  } else {
    stage = STAGE_MAP[weakestKey];
  }

  return { pillars: pillars, byKey: byKey, weakestKey: weakestKey, stage: stage, allGreen: allGreen };
}

function buildPayload(results) {
  const answers = { q1: state.answers.q1 || '' };
  ['q2', 'q3', 'q4', 'q5', 'q6', 'q7', 'q8', 'q9', 'q10', 'q11'].forEach(function (qid) {
    const q = QUESTIONS.find(function (x) { return x.id === qid; });
    answers[qid] = q.options[state.answers[qid]].points;
  });
  answers.q12 = state.answers.q12 || '';
  answers.q13 = state.answers.q13 || '';

  const q10 = QUESTIONS.find(function (x) { return x.id === 'q10'; });
  const q11 = QUESTIONS.find(function (x) { return x.id === 'q11'; });

  return {
    name: state.lead.name,
    handle: state.lead.handle,
    email: state.lead.email,
    followers: state.lead.followers,
    lang: state.lang,
    answers: answers,
    q10_label: q10.options[state.answers.q10].en,
    q11_label: q11.options[state.answers.q11].en,
    scores: {
      positioning: results.byKey.positioning.pct,
      content: results.byKey.content.pct,
      conversion: results.byKey.conversion.pct,
      offer: results.byKey.offer.pct
    },
    colors: {
      positioning: results.byKey.positioning.color,
      content: results.byKey.content.color,
      conversion: results.byKey.conversion.color,
      offer: results.byKey.offer.color
    },
    weakest_pillar: results.byKey[results.weakestKey].name,
    stage: results.stage,
    stage_name: STAGES[results.stage].name[state.lang],
    completed_at: new Date().toISOString(),
    source_url: location.href
  };
}

function postResults(results) {
  if (state.posted || !RESULTS_ENDPOINT) return;
  state.posted = true;
  try {
    fetch(RESULTS_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(buildPayload(results)),
      keepalive: true
    }).catch(function (err) { console.log('Results POST failed:', err); });
  } catch (err) {
    console.log('Results POST failed:', err);
  }
}

const app = document.getElementById('app');
const topbarRight = document.getElementById('topbar-right');
const tickerSlot = document.getElementById('ticker-slot');

function render() {
  document.getElementById('footer-text').textContent = t('footer');
  document.documentElement.lang = state.lang;
  app.className = state.screen === 'landing' ? 'landing' : '';
  if (state.screen === 'landing') {
    topbarRight.innerHTML =
      '<button type="button" class="lang-btn' + (state.lang === 'en' ? ' active' : '') + '" data-lang="en">EN</button>' +
      '<button type="button" class="lang-btn' + (state.lang === 'nl' ? ' active' : '') + '" data-lang="nl">NL</button>';
    topbarRight.querySelectorAll('.lang-btn').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.lang = btn.getAttribute('data-lang');
        render();
      });
    });
    renderTicker();
  } else {
    topbarRight.innerHTML = '';
    tickerSlot.innerHTML = '';
  }
  if (state.screen === 'landing') renderLanding();
  else if (state.screen === 'lead') renderLead();
  else if (state.screen === 'question') renderQuestion();
  else if (state.screen === 'interstitial') renderInterstitial();
  else if (state.screen === 'results') renderResults();
  window.scrollTo(0, 0);
}

    '<div class="mockup" aria-hidden="true">' +
      '<div class="mock-card mock-side mock-left">' +
        '<div class="mock-side-title">Pillars</div>' + pillarRows +
      '</div>' +
      '<div class="mock-card mock-center">' +
        '<div class="mock-eyebrow">Profile to Profit Assessment</div>' +
        '<div class="mock-title">' + t('mockTitle') + '</div>' +
        '<div class="mock-serif">Aithos Marketing</div>' +
        '<div class="mock-stages">' + stagesRows + '</div>' +
      '</div>' +
      '<div class="mock-card mock-side mock-right">' +
        '<div class="mock-side-title">' + t('fixHeading').replace(': ', '') + '</div>' + stepRows +
        '<div class="mock-pillar" style="margin-top:16px">' +
          '<div class="mock-track"><div class="mock-fill b-orange" style="width:40%"></div></div>' +
        '</div>' +
      '</div>' +
    '</div>'
  );
}

function renderLanding() {
  app.innerHTML =
    '<div class="hero">' +
      '<h1>' + t('landingHeadlineHtml') + '</h1>' +
      '<p class="sub">' + t('landingSub') + '</p>' +
    '</div>' +
    mockupHtml() +
    '<div class="start-card">' +
      '<div class="start-peek"></div>' +
      '<div class="progress-label">1 / 13</div>' +
      '<div class="progress-track"><div class="progress-fill" style="width:7.7%"></div></div>' +
      '<button type="button" class="btn" id="start-btn">' + t('landingBtn') + '</button>' +
      '<p class="micro">' + t('landingMicro') + '</p>' +
    '</div>';
  document.getElementById('start-btn').addEventListener('click', function () {
    state.screen = 'lead';
    render();
  });
}

function renderLead() {
  app.innerHTML =
    '<div class="panel">' +
    '<h2>' + t('leadHeading') + '</h2>' +
    '<form id="lead-form" novalidate>' +
      '<div class="field">' +
        '<label for="lead-name">' + t('leadName') + '</label>' +
        '<input id="lead-name" type="text" autocomplete="given-name" value="' + esc(state.lead.name) + '">' +
      '</div>' +
      '<div class="field">' +
        '<label for="lead-handle">' + t('leadHandle') + '</label>' +
        '<div class="handle-wrap"><span class="at">@</span>' +
        '<input id="lead-handle" type="text" autocomplete="off" autocapitalize="none" value="' + esc(state.lead.handle) + '"></div>' +
      '</div>' +
      '<div class="field">' +
        '<label for="lead-followers">' + t('leadFollowers') + '</label>' +
        '<input id="lead-followers" type="text" inputmode="numeric" autocomplete="off" value="' + esc(state.lead.followers) + '">' +
      '</div>' +
      '<div class="field"><button type="submit" class="btn">' + t('leadBtn') + '</button></div>' +
    '</form>' +
    '</div>';
  document.getElementById('lead-form').addEventListener('submit', function (e) {
    e.preventDefault();
    const nameEl = document.getElementById('lead-name');
    const handleEl = document.getElementById('lead-handle');
    const followersEl = document.getElementById('lead-followers');
    const name = nameEl.value.trim();
    const handle = handleEl.value.trim().replace(/^@+/, '');
    const followers = followersEl.value.trim();
    let valid = true;
    nameEl.classList.toggle('invalid', !name);
    handleEl.classList.toggle('invalid', !handle);
    followersEl.classList.toggle('invalid', !followers);
    if (!name || !handle || !followers) valid = false;
    if (!valid) return;
    state.lead.name = name;
    state.lead.handle = handle;
    state.lead.followers = followers;
    state.screen = 'question';
    state.qIndex = 0;
    render();
  });
}

function renderQuestion() {
  const q = QUESTIONS[state.qIndex];
  const num = state.qIndex + 1;
  let html =
    '<div class="q-top">' +
      '<button type="button" class="back-btn" id="back-btn" aria-label="Back">&#8592;</button>' +
      '<div class="progress-wrap">' +
        '<div class="progress-label">' + num + ' / 13</div>' +
        '<div class="progress-track"><div class="progress-fill" style="width:' + (num / 13 * 100) + '%"></div></div>' +
      '</div>' +
    '</div>' +
    '<div class="panel">' +
    '<h2>' + q.text[state.lang] + '</h2>';

  if (q.type === 'mc') {
    html += '<div class="options">';
    q.options.forEach(function (opt, i) {
      const sel = state.answers[q.id] === i ? ' selected' : '';
      html += '<button type="button" class="option' + sel + '" data-i="' + i + '">' + opt[state.lang] + '</button>';
    });
    html += '</div>';
  } else {
    html +=
      '<textarea class="open-area" id="open-input">' + esc(state.answers[q.id] || '') + '</textarea>' +
      '<div class="field"><button type="button" class="btn" id="continue-btn">' + t('continueBtn') + '</button></div>';
  }
  html += '</div>';
  app.innerHTML = html;

  document.getElementById('back-btn').addEventListener('click', function () {
    if (state.advancing) return;
    if (state.qIndex === 0) {
      state.screen = 'lead';
    } else {
      state.qIndex -= 1;
    }
    render();
  });

  if (q.type === 'mc') {
    app.querySelectorAll('.option').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (state.advancing) return;
        state.advancing = true;
        state.answers[q.id] = parseInt(btn.getAttribute('data-i'), 10);
        app.querySelectorAll('.option').forEach(function (b) { b.classList.remove('selected'); });
        btn.classList.add('selected');
        setTimeout(function () {
          state.advancing = false;
          advance();
        }, 250);
      });
    });
  } else {
    document.getElementById('continue-btn').addEventListener('click', function () {
      state.answers[q.id] = document.getElementById('open-input').value.trim();
      advance();
    });
  }
}

function advance() {
  if (state.qIndex < QUESTIONS.length - 1) {
    state.qIndex += 1;
    render();
  } else {
    state.screen = 'interstitial';
    render();
    setTimeout(function () {
      state.screen = 'results';
      render();
    }, 2000);
  }
}

function renderInterstitial() {
  app.innerHTML =
    '<div class="interstitial">' +
      '<div class="spinner"></div>' +
      '<h2>' + t('analyzing') + '</h2>' +
    '</div>';
}

function renderResults() {
  const results = computeResults();
  const stage = STAGES[results.stage];

  let html =
    '<div class="panel">' +
    '<h1>' + esc(state.lead.name) + t('greeting') + '</h1>' +
    '<p class="greet-sub">' + t('greetingSub') + '</p>' +
    '<div class="stage-card">' +
      '<h2>' + stage.name[state.lang] + '</h2>' +
      '<p>' + stage.diagnosis[state.lang] + '</p>' +
    '</div>' +
    '<div class="pillars">';

  results.pillars.forEach(function (p) {
    html +=
      '<div class="pillar">' +
        '<div class="pillar-head">' +
          '<span class="pillar-name">' + p.name + '</span>' +
          '<span class="pillar-pct c-' + p.color + '">' + p.pct + '%</span>' +
        '</div>' +
        '<div class="bar-track"><div class="bar-fill b-' + p.color + '" data-pct="' + p.pct + '"></div></div>' +
        '<p class="verdict">' + VERDICTS[p.key][p.color][state.lang] + '</p>' +
      '</div>';
  });
  html += '</div>';

  if (results.stage !== 5) {
    const plan = PLANS[results.weakestKey][state.lang];
    html +=
      '<div class="fix-section">' +
        '<h2>' + t('fixHeading') + results.byKey[results.weakestKey].name + '</h2>' +
        '<p class="fix-intro">' + t('fixIntro') + '</p>' +
        '<ol class="fix-list">';
    plan.steps.forEach(function (step) { html += '<li>' + step + '</li>'; });
    html += '</ol>';
    if (plan.outro) html += '<p class="fix-outro">' + plan.outro + '</p>';
    html += '</div>';
  }

  html +=
    '<div class="benchmark">' + t('benchmark') + '</div>' +
    '<div class="outro-block">' + t('outroHtml') + '</div>' +
    '<button type="button" class="btn btn-outline no-print" id="download-btn">' + t('downloadBtn') + '</button>' +
    '</div>';

  app.innerHTML = html;

  document.getElementById('download-btn').addEventListener('click', function () {
    const prevTitle = document.title;
    document.title = 'Profile to Profit Assessment - ' + state.lead.name;
    window.addEventListener('afterprint', function restore() {
      document.title = prevTitle;
      window.removeEventListener('afterprint', restore);
    });
    window.print();
  });

  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      app.querySelectorAll('.bar-fill').forEach(function (bar) {
        bar.style.width = bar.getAttribute('data-pct') + '%';
      });
    });
  });

  postResults(results);
}

document.getElementById('logo').src = LOGO_SRC;
document.getElementById('footer-logo').src = LOGO_SRC;
render();
</script>
</body>
</html>
